<VirtualHost *:80>
    ServerName apps.rapidplast.co.id
    ServerAlias 192.168.180.22

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^apps\.rapidplast\.co\.id(?::80)?$ [NC]
    RewriteRule ^/mira(/.*)?$ https://apps.rapidplast.co.id%{REQUEST_URI} [R=301,L,NE]

    RedirectMatch 302 ^/$ /mira

    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Prefix "/mira"

    ProxyPass "/mira/api/" "http://127.0.0.1:13011/api/"
    ProxyPassReverse "/mira/api/" "http://127.0.0.1:13011/api/"
    ProxyPass "/mira" "http://127.0.0.1:13010/mira"
    ProxyPassReverse "/mira" "http://127.0.0.1:13010/mira"
    ProxyPass "/qualisync" "http://127.0.0.1:8081/qualisync"
    ProxyPassReverse "/qualisync" "http://127.0.0.1:8081/qualisync"

    <LocationMatch "^/mira(?:/|$)">
        Require ip 192.168.180.0/24 192.168.210.0/24 192.168.186.2/32 10.8.0.0/24 10.42.42.42/32 127.0.0.1 ::1
    </LocationMatch>
    <LocationMatch "^/qualisync(?:/|$)">
        Require ip 192.168.180.0/24 192.168.210.0/24 192.168.186.2/32 10.8.0.0/24 10.42.42.42/32 127.0.0.1 ::1
    </LocationMatch>
</VirtualHost>

<VirtualHost *:443>
    ServerName apps.rapidplast.co.id
    ServerAlias 192.168.180.22

    SSLEngine on
    SSLCertificateFile /root/gateway/nginx/ssl/apps.rapidplast.co.id.crt
    SSLCertificateKeyFile /root/gateway/nginx/ssl/apps.rapidplast.co.id.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Prefix "/mira"

    RedirectMatch 302 ^/$ /mira

    ProxyPass "/mira/api/" "http://127.0.0.1:13011/api/"
    ProxyPassReverse "/mira/api/" "http://127.0.0.1:13011/api/"
    ProxyPass "/mira" "http://127.0.0.1:13010/mira"
    ProxyPassReverse "/mira" "http://127.0.0.1:13010/mira"
    ProxyPass "/qualisync" "http://127.0.0.1:8081/qualisync"
    ProxyPassReverse "/qualisync" "http://127.0.0.1:8081/qualisync"

    <LocationMatch "^/mira(?:/|$)">
        Require ip 192.168.180.0/24 192.168.210.0/24 192.168.186.2/32 10.8.0.0/24 10.42.42.42/32 127.0.0.1 ::1
    </LocationMatch>
    <LocationMatch "^/qualisync(?:/|$)">
        Require ip 192.168.180.0/24 192.168.210.0/24 192.168.186.2/32 10.8.0.0/24 10.42.42.42/32 127.0.0.1 ::1
    </LocationMatch>
</VirtualHost>
