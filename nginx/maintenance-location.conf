location = /maintenance {
    return 301 /mira/;
}

location ^~ /maintenance/ {
    rewrite ^/maintenance/(.*)$ /mira/$1 permanent;
}

location = /mira {
    set $maintenance_frontend maintenance-frontend:3000;
    proxy_pass http://$maintenance_frontend$request_uri;
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    proxy_hide_header ETag;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mira;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location ^~ /mira/api/ {
    set $maintenance_backend maintenance-backend-web:80;
    rewrite ^/mira/api/(.*)$ /api/$1 break;
    proxy_pass http://$maintenance_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mira;
}

location ^~ /mira/ {
    set $maintenance_frontend maintenance-frontend:3000;
    proxy_pass http://$maintenance_frontend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mira;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
